name: CI

on:
  push:
  pull_request:
  # Те же проверки вызывает release.yml перед публикацией — через workflow_call,
  # чтобы не держать вторую копию списка шагов, которая со временем отстанет.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
